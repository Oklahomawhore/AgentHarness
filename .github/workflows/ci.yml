name: CI

'on':
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  linux:
    name: node 24 / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: static
            command: check:ci:static
          - lane: coverage
            command: check:ci:coverage
          - lane: consumers
            command: check:ci:consumers
    env:
      DSH_GATE_CONCURRENCY: '2'
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_COVERAGE_TEST_TIMEOUT_MS: '30000'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '2'
      DSH_OXLINT_THREADS: '2'
      DSH_PUBLINT_CONCURRENCY: '2'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bubblewrap
        if: matrix.lane != 'static'
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Install Chromium
        if: matrix.lane == 'consumers'
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - uses: actions/setup-python@v6.3.0
        if: matrix.lane == 'consumers'
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/sdk/uv.lock
      - name: Install Python collaboration tooling
        if: matrix.lane == 'consumers'
        run: python -m pip install uv==0.11.23
      - name: Verify npm install layout
        if: matrix.lane == 'static'
        run: pnpm run verify-npm-install-layout
      - name: Run lane
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm run ${{ matrix.command }}

  benchmarks:
    name: node 24 / benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install benchmark browser
        run: pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium
      - run: pnpm run check:ci:bench
        env:
          DSH_GATE_VERBOSE: '1'

  node-compat:
    name: node ${{ matrix.node }} / compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24.9', '26']
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_NODE_COMPAT_SKIP_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:node-compat
      - run: pnpm exec vitest run packages/boot/app-boot/tests/loader-shape.compat.spec.ts

  windows-native:
    name: windows node 24 / native complete
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_COVERAGE_MAX_WORKERS: '1'
      DSH_COVERAGE_TEST_TIMEOUT_MS: '30000'
      DSH_PUBLINT_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable Windows symlinks
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci:windows-complete

  python-sdk:
    name: python 3.10 / keyless SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/sdk/uv.lock
      - run: python -m pip install uv==0.11.23
      - run: uv run --python 3.10 --group test --project python/sdk pytest

  python-runtime:
    name: python runtime / native wheels
    uses: ./.github/workflows/build-exe-for-python-sdk.yml

  all-checks-passed:
    name: all checks passed
    runs-on: ubuntu-24.04
    needs: [linux, benchmarks, node-compat, windows-native, python-sdk, python-runtime]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every lane to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ ! "$RESULTS" =~ ^success(,success)*$ ]]; then
            echo "::error::Required lane results: $RESULTS"
            exit 1
          fi
