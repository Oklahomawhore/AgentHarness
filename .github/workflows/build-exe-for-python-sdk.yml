name: Build single-exe

# Native builds for the release targets; see
# .agents/notes/implemented/architecture/2026-07-10-single-file-executable-sdk-runtime-distribution.md.
# A full target run retains one SDK wheel and five runtime wheels; subset
# dispatch retains the SDK wheel and selected runtime wheels. Bare executables
# and source closures are test inputs. Run manually or call it from CI or
# the Python release workflow. All smoke tests use local model fixtures.
# Checkout uses the triggering ref, so dispatch needs no separate ref input.
'on':
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated pkg targets to build. Any subset of: node24-linux-x64,
          node24-linux-arm64, node24-macos-arm64, node24-macos-x64, node24-win-x64. Empty builds all five.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      targets:
        type: string
        required: false
        default: ''
      release:
        type: boolean
        required: false
        default: false

concurrency:
  # Keep the called workflow distinct from its caller's concurrency group;
  # github.workflow identifies the caller inside a reusable workflow and keeps
  # an ordinary CI run from cancelling a full release validation on the same ref.
  group: build-single-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Job-level conditions cannot inspect `matrix`, so validate target names and
  # construct the matrix before the dependent jobs.
  plan:
    name: plan targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      repository-version: ${{ steps.version.outputs.repository-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve repository version
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import runpy

          release = runpy.run_path("scripts/build-python-release.py")
          repository_version = release["repository_version"]()
          wheel_version = release["pep440_version"](repository_version)
          print(f"repository-version={repository_version}")
          print(f"version={wheel_version}")
          PY

      - name: Compute matrix from targets input
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          platforms = json.loads(Path("python/sdk-runtime/platforms.json").read_text())
          runners = {
              "linux-x64": "ubuntu-24.04",
              "linux-arm64": "ubuntu-24.04-arm",
              "macos-arm64": "macos-15",
              "macos-x64": "macos-15-intel",
              "win-x64": "windows-2025",
          }
          if set(platforms) != set(runners):
              raise SystemExit("Native runner inventory differs from the wheel platform manifest")
          raw = os.environ["TARGETS"].strip()
          targets = [value.strip() for value in raw.split(",")] if raw else [f"node24-{name}" for name in platforms]
          if len(targets) != len(set(targets)):
              raise SystemExit("Duplicate runtime target")
          matrix = []
          for target in targets:
              platform = target.removeprefix("node24-")
              if target != f"node24-{platform}" or platform not in platforms:
                  raise SystemExit(f"Unknown runtime target: {target!r}")
              metadata = platforms[platform]
              matrix.append({"target": target, "platform": platform, "runner": runners[platform],
                             "shell": "pwsh" if platform == "win-x64" else "bash", "tag": metadata["tag"],
                             "executable": metadata["executable"]})
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PYTHON

  sdk-wheel:
    needs: plan
    name: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Install Python build tooling
        run: python -m pip install uv==0.11.23

      - name: Build release-shaped SDK wheel
        run: >-
          python scripts/build-python-release.py
          --package sdk
          --output-dir dist-python

      - uses: actions/upload-artifact@v7
        with:
          name: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          path: dist-python/deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [plan, sdk-wheel]
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Enable Windows symlinks
        if: runner.os == 'Windows'
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      # setup-node's built-in pnpm store cache keys on platform AND arch, so
      # the Linux architectures sharing runner.os stay on separate caches.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Install Python build tooling
        run: python -m pip install uv==0.11.23

      # Cache pkg's target Node binary; lockfile changes roll the
      # exact key while the restore prefix can seed its replacement.
      - uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-fetch-${{ matrix.target }}-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Rebuild Linux node-pty against manylinux 2.28
        if: runner.os == 'Linux'
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::Unsupported Linux runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)"
          addon="$addon_dir/build/Release/pty.node"
          node_root="$(dirname "$(dirname "$(realpath "$(command -v node)")")")"
          pnpm_setup_root="$RUNNER_TEMP/setup-pnpm"
          mkdir -p "$RUNNER_TEMP/node-gyp"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOST_NODE_ROOT="$node_root" \
            -e PNPM_SETUP_ROOT="$pnpm_setup_root" \
            -e npm_config_devdir="$RUNNER_TEMP/node-gyp" \
            -e npm_config_python=/opt/python/cp310-cp310/bin/python \
            -v "$PWD:$PWD" \
            -v "$node_root:$node_root:ro" \
            -v "$pnpm_setup_root:$pnpm_setup_root:ro" \
            -v "$RUNNER_TEMP/node-gyp:$RUNNER_TEMP/node-gyp" \
            -w "$addon_dir" \
            "$image" \
            bash -euxo pipefail -c \
              'export PATH="$HOST_NODE_ROOT/bin:$PNPM_SETUP_ROOT/node_modules/.bin:$PATH"; npm_config_build_from_source=true pnpm --config.verify-deps-before-run=false run install'
          [ -f "$addon" ] || { echo "::error::$addon missing after manylinux rebuild"; exit 1; }
          readelf --version-info "$addon" | tee node-pty-glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' node-pty-glibc-versions.txt | sort -V | tail -1)"
          [ -n "$maximum" ] || { echo "::error::No GLIBC requirements found in $addon"; exit 1; }
          dpkg --compare-versions "$maximum" le 2.28 || {
            echo "::error::node-pty addon requires GLIBC_$maximum but wheel claims manylinux_2_28"
            exit 1
          }

      - name: Build single-exe
        run: pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=${{ matrix.target }}

      - name: Full-turn SDK, executable snapshot, and direct-binary smoke
        run: >-
          uv run --python 3.10 --group test --project python/sdk
          python scripts/smoke-python-runtime.py
          --scenario all
          --exe "${{ github.workspace }}/dist-exe/${{ matrix.executable }}"

      - name: Build release-shaped runtime wheel
        run: >-
          python scripts/build-python-release.py
          --package runtime
          --platform "${{ matrix.platform }}"
          --runtime-exe "${{ github.workspace }}/dist-exe/${{ matrix.executable }}"
          --output-dir dist-python

      - uses: actions/download-artifact@v8
        with:
          name: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          path: dist-python

      - name: Run installed-wheel keyless black-box tests (POSIX)
        if: runner.os != 'Windows'
        env:
          SDK_WHEEL: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          RUNTIME_WHEEL: deepseek_harness_runtime_bin-${{ needs.plan.outputs.version }}-py3-none-${{ matrix.tag }}.whl
        run: |
          venv="$(mktemp -d "$RUNNER_TEMP/dsh-sdk-venv.XXXXXX")"
          consumer="$(mktemp -d "$RUNNER_TEMP/dsh-wheel-consumer.XXXXXX")"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install "$GITHUB_WORKSPACE/dist-python/$SDK_WHEEL" "$GITHUB_WORKSPACE/dist-python/$RUNTIME_WHEEL"
          cd "$consumer"
          env -u PYTHONPATH -u DSH_RUNTIME_MODE "$venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke-python-runtime.py" --scenario all --installed-wheel

      - name: Run installed-wheel keyless black-box tests (Windows)
        if: runner.os == 'Windows'
        env:
          SDK_WHEEL: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          RUNTIME_WHEEL: deepseek_harness_runtime_bin-${{ needs.plan.outputs.version }}-py3-none-${{ matrix.tag }}.whl
        run: |
          $venv = Join-Path $env:RUNNER_TEMP ("dsh-sdk-venv-" + [guid]::NewGuid())
          $consumer = Join-Path $env:RUNNER_TEMP ("dsh-wheel-consumer-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $consumer -ErrorAction Stop | Out-Null
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install "$env:GITHUB_WORKSPACE/dist-python/$env:SDK_WHEEL" "$env:GITHUB_WORKSPACE/dist-python/$env:RUNTIME_WHEEL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = $null
          $env:DSH_RUNTIME_MODE = $null
          Push-Location $consumer
          try {
            & $python "$env:GITHUB_WORKSPACE/scripts/smoke-python-runtime.py" --scenario all --installed-wheel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Check Linux GLIBC requirements
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          readelf --version-info "${{ github.workspace }}/dist-exe/${{ matrix.executable }}" | tee glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' glibc-versions.txt | sort -V | tail -1)"
          [ -n "$maximum" ] || { echo "::error::No GLIBC requirements found"; exit 1; }
          dpkg --compare-versions "$maximum" le 2.28 || {
            echo "::error::Executable requires GLIBC_$maximum but wheel claims manylinux_2_28"
            exit 1
          }

      - name: Check macOS payload architecture and deployment target
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ github.workspace }}/dist-exe/${{ matrix.executable }}
        run: |
          case "$PLATFORM" in
            macos-arm64) arch=arm64 ;;
            macos-x64) arch=x86_64 ;;
            *) echo "::error::Unsupported macOS platform $PLATFORM"; exit 1 ;;
          esac
          for payload in "$EXE" "$EXE-rg" "$EXE-spawn-helper"; do
            lipo "$payload" -verify_arch "$arch"
          done
          python3 scripts/check-macos-deployment-target.py --platform "$PLATFORM" "$EXE" "$EXE-rg" "$EXE-spawn-helper"

      - name: Run wheel in a manylinux 2.28 container
        if: runner.os == 'Linux'
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          SDK_WHEEL: deepseek_harness_sdk-${{ needs.plan.outputs.version }}-py3-none-any.whl
          RUNTIME_WHEEL: deepseek_harness_runtime_bin-${{ needs.plan.outputs.version }}-py3-none-${{ matrix.tag }}.whl
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::Unsupported Linux runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          docker run --rm -e SDK_WHEEL -e RUNTIME_WHEEL -e DSH_TELEMETRY_DISABLED -v "$PWD:/work" -w /work "$image" bash -euxo pipefail -c '
            /opt/python/cp310-cp310/bin/python -m venv /tmp/dsh-sdk
            /tmp/dsh-sdk/bin/python -m pip install "/work/dist-python/$SDK_WHEEL" "/work/dist-python/$RUNTIME_WHEEL"
            cd /tmp
            env -u PYTHONPATH -u DSH_RUNTIME_MODE /tmp/dsh-sdk/bin/python /work/scripts/smoke-python-runtime.py --scenario sdk-default --installed-wheel
          '

      - uses: actions/upload-artifact@v7
        with:
          name: deepseek_harness_runtime_bin-${{ needs.plan.outputs.version }}-py3-none-${{ matrix.tag }}.whl
          path: dist-python/deepseek_harness_runtime_bin-${{ needs.plan.outputs.version }}-py3-none-${{ matrix.tag }}.whl
          if-no-files-found: error
          retention-days: 7
