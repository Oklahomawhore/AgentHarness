# Optional deployment defaults for the existing Web summary settings group.
# Saved scope-context settings take precedence; credentials stay in Models.
- id: development-task-context-backend
  name: '@deepseek-ai/dsh-development-task-context/configured'
  config:
    selection:
      mode: semantic
      provider: deepseek-official
      model: deepseek-flash
      maxCalls: 100
    auditSessionId: scope-context-audit
    temperature: 0
    reasoningEffort: off
    maxConcurrentCalls: 2
    maxInputBytes: 131072
    maxOutputTokens: 2048
    maxOutputBytes: 65536
    timeoutMs: 20000
