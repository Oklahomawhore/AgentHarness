- id: skill-filesystem
  config:
    includeDefaultRoots: false
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: task-lineage-parent-revisions-room
      name: '@deepseek-ai/dsh-development-room'
      config:
        nodeId: snapshot-node
        presenceTtlMs: 10000
        maxParticipants: 16
        maxRooms: 32
        maxTextBytes: 2048
    - id: task-lineage-parent-revisions-task
      name: '@deepseek-ai/dsh-development-task'
      config:
        maxTasks: 32
        maxEventsPerTask: 64
        maxMergeParents: 8
        maxContextBlockBytes: 65536
        maxLineageTasks: 64
        maxTextBytes: 2048
        roomRetryIntervalMs: 10000
    - id: task-lineage-parent-revisions-text
      name: '@deepseek-ai/dsh-development-task-context/text'
    - id: task-lineage-parent-revisions-context
      name: '@deepseek-ai/dsh-development-task-context'
      config:
        maxContextBytesPerStep: 65536
    - id: task-lineage-parent-revisions-bindings
      name: '../../../packages/collaboration/development-task-context/tests/fixtures/snapshot-lineage.ts'
