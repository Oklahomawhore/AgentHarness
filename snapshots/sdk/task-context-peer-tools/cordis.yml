- id: skill-filesystem
  config:
    includeDefaultRoots: false
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: task-context-peer-tools-room
      name: '@deepseek-ai/dsh-development-room'
      config:
        nodeId: snapshot-task-owner
        presenceTtlMs: 10000
        maxParticipants: 16
        maxRooms: 32
        maxTextBytes: 4096
    - id: task-context-peer-tools-task
      name: '@deepseek-ai/dsh-development-task'
      config:
        maxTasks: 32
        maxEventsPerTask: 64
        maxMergeParents: 8
        maxContextBlockBytes: 65536
        maxLineageTasks: 64
        maxTextBytes: 4096
        roomRetryIntervalMs: 10000
    - id: task-context-peer-tools-provider
      name: '@deepseek-ai/dsh-development-task-context/text'
    - id: task-context-peer-tools-context
      name: '@deepseek-ai/dsh-development-task-context'
      config:
        maxContextBytesPerStep: 6000
    - id: task-context-peer-tools-fixture
      name: './peer-tools-fixture.mjs'
